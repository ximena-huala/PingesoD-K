# nginx del contenedor frontend: sirve el SPA y reenvía /api al backend.
# Frontend y API quedan en el mismo origen (localhost:8082) → sin CORS.

server {
    listen 80;
    server_name _;

    # No exponer la versión de nginx en la cabecera Server.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Permite subir los Excel/CSV de Bsale sin toparse con el límite por defecto.
    client_max_body_size 25m;

    # SPA React: cualquier ruta desconocida cae en index.html.
    # Cabeceras de seguridad para el contenido del frontend (el backend ya pone
    # las suyas en /api). El CSP es estricto porque el build solo referencia
    # scripts/estilos propios de /assets; 'unsafe-inline' en style-src es para
    # los estilos inline de React. frame-ancestors 'none' bloquea el clickjacking.
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        try_files $uri /index.html;
    }

    # API → servicio "backend" de docker-compose (red interna).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

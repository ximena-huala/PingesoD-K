# nginx del contenedor frontend: sirve el SPA y reenvía /api al backend.
# Frontend y API quedan en el mismo origen (localhost:8081) → sin CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permite subir los Excel/CSV de Bsale sin toparse con el límite por defecto.
    client_max_body_size 25m;

    # SPA React: cualquier ruta desconocida cae en index.html.
    location / {
        try_files $uri /index.html;
    }

    # API → servicio "backend" de docker-compose (red interna).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

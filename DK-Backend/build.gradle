plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cl.dk'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.13.0'

// Apache POI (genera el Excel)
	implementation 'org.apache.poi:poi-ooxml:5.5.1'

	// Documentación OpenAPI / Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
}

tasks.named('test') {
	useJUnitPlatform()
	// Mismo cuento que en bootRun: el smoke test le pega a Falabella de verdad,
	// así que en Windows necesita el almacén de certificados del sistema.
	if (System.getProperty('os.name').toLowerCase().contains('windows')) {
		systemProperty 'javax.net.ssl.trustStoreType', 'Windows-ROOT'
	}
}

tasks.named('bootRun') {
	// En Windows, antivirus como Avast se meten en medio del SSL y re-firman los
	// certificados con su propia CA. Esa CA está en el almacén de Windows pero no
	// en el de la JVM, así que al llamar a Falabella la app revienta con
	// "PKIX path building failed". Con Windows-ROOT le decimos a Java que use el
	// almacén del sistema, igual que el navegador, y deja de quejarse.
	if (System.getProperty('os.name').toLowerCase().contains('windows')) {
		systemProperty 'javax.net.ssl.trustStoreType', 'Windows-ROOT'
	}
}

tasks.register('bcryptHash', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'cl.dk.rentabilidad.BcryptHashRunner'
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

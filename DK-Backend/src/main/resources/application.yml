spring:
  application:
    name: rentabilidad
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Carga .env local (Falabella, BD, JWT). Las variables del sistema tienen prioridad.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Soporta DATABASE_* (Spring) y DB_* (.env de Falabella) como alias.
    url: ${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/dk_app}}
    username: ${DATABASE_USERNAME:${DB_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:28800000}

# Integración Falabella (solo lectura). Credenciales vía .env o variables de entorno.
falabella:
  api:
    base-url: https://sellercenter-api.falabella.com
    user-id: ${FALABELLA_USER_ID:}
    api-key: ${FALABELLA_API_KEY:}
    seller-id: ${FALABELLA_SELLER_ID:}
    version: "1.0"

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
  integrations:
    bsale:
      enabled: ${BSALE_ENABLED:false}
      base-url: ${BSALE_BASE_URL:https://api.bsale.cl}
      access-token: ${BSALE_ACCESS_TOKEN:}
      page-size: ${BSALE_PAGE_SIZE:50}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dk_app
    username: postgres
    password: CAMBIAR

jwt:
  secret: CAMBIAR-MINIMO-32-CARACTERES-ALEATORIOS
  expiration: 28800000

app:
  cors:
    allowed-origins: https://app.tuempresa.cl
  integrations:
    bsale:
      enabled: true
      access-token: CAMBIAR
